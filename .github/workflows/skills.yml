name: validate-skills

on:
  push:
    paths:
      - "skills/**"
      - "build/validate-skills.py"
  pull_request:
    paths:
      - "skills/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: 校验 SKILL.md frontmatter 与命名
        run: python3 build/validate-skills.py skills
